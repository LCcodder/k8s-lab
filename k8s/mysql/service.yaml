apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: kafka-template
spec:
  clusterIP: None            # внутренний headless, DB_HOST=mysql
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-external
  namespace: kafka-template
spec:
  type: NodePort
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      nodePort: 30306