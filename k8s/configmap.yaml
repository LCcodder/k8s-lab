apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kafka-template
data:
  KAFKA_HOST: "kafka"
  KAFKA_PORT: "29092"
  KAFKA_CLUSTER: "kafka:29092"      # consumer-bot
  KAFKA_CONNECTION: "kafka:29092"   # producer-api
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "basketball_aggregator"
  DB_USER: "root"
  API_PORT: "3000"
  # справочно: реальные значения заданы в Service-манифестах
  API_EXTERNAL_PORT: "30080"
  MYSQL_EXTERNAL_PORT: "30306"
  KAFKA_EXTERNAL_PORT: "30092"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: kafka-template
data:
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9094,CONTROLLER://:9093"
  KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:30092"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"