apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-bot
  namespace: kafka-template
  labels:
    app: consumer-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: consumer-bot
  template:
    metadata:
      labels:
        app: consumer-bot
    spec:
      imagePullSecrets:
        - name: dockerhub
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          envFrom:
            - configMapRef:
                name: app-config
          command: ["sh", "-c"]
          args:
            - |
              until nc -z "$KAFKA_HOST" "$KAFKA_PORT"; do echo "waiting for kafka"; sleep 3; done
              until nc -z "$DB_HOST" "$DB_PORT"; do echo "waiting for mysql"; sleep 3; done
      containers:
        - name: consumer-bot
          image: "{{ .Values.image.repository }}:{{ required "укажи --set image.tag" .Values.image.tag }}"
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: BOT_TOKEN
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD