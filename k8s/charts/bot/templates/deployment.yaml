
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-bot
  namespace: kafka-template
  labels:
    app: consumer-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: consumer-bot
  template:
    metadata:
      labels:
        app: consumer-bot
    spec:
      imagePullSecrets:
        - name: dockerhub
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          envFrom:
            - configMapRef:
                name: app-config
          command: ["sh", "-c"]
          args:
            - |
              until nc -z "$KAFKA_HOST" "$KAFKA_PORT"; do echo "waiting for kafka"; sleep 3; done
              until nc -z "$DB_HOST" "$DB_PORT"; do echo "waiting for mysql"; sleep 3; done
      containers:
        - name: consumer-bot
          image: "{{ .Values.image.repository }}:{{ required "укажи --set image.tag" .Values.image.tag }}"
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: BOT_TOKEN
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD

            - name: HTTP_PROXY
              value: "http://127.0.0.1:10808"
            - name: HTTPS_PROXY
              value: "http://127.0.0.1:10808"

        - name: singbox
          image: ghcr.io/sagernet/sing-box:latest
          args:
            - "-D"
            - "/var/lib/sing-box"
            - "-c"
            - "/etc/sing-box/config.json"
            - "run"
          ports:
            - name: proxy
              containerPort: 10808
              protocol: TCP
          volumeMounts:
            - name: singbox-config
              mountPath: /etc/sing-box
              readOnly: true
            - name: singbox-data
              mountPath: /var/lib/sing-box
          readinessProbe:
            tcpSocket:
              port: 10808
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

      volumes:
        - name: singbox-config
          secret:
            secretName: singbox-config
        - name: singbox-data
          emptyDir: {}
