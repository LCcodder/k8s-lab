apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka-template
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 29092
      targetPort: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: kafka-template
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: kafka-external
      port: 9094
      targetPort: kafka-external
      nodePort: 30092