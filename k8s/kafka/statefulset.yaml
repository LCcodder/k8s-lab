apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka-template
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false    # иначе k8s подсунет KAFKA_PORT=tcp://... и брокер упадёт
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.1
          ports:
            - name: kafka
              containerPort: 29092
            - name: kafka-external
              containerPort: 9094
          envFrom:
            - configMapRef:
                name: kafka-config
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1280Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi