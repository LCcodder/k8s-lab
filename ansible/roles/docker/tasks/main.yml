---
# Таски повторяют твой install-скрипт (Ubuntu, docker.gpg, standalone compose, lazydocker),
# только идемпотентно: повторный запуск ничего не ломает и не переустанавливает.

# === Удаление старых версий Docker (если есть) ===
- name: Remove old Docker versions (if any)
  ansible.builtin.apt:
    name: [docker, docker-engine, docker.io, containerd, runc]
    state: absent
  tags: docker_install

# === Установка зависимостей ===

- name: Install dependencies
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, lsb-release, python3-docker]
    state: present
    update_cache: false
    cache_valid_time: 3600
  tags: docker_install


# === Добавление GPG-ключа Docker ===
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: docker_install

- name: Add Docker GPG key (dearmored)
  ansible.builtin.shell:
    cmd: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    executable: /bin/bash
    creates: /etc/apt/keyrings/docker.gpg
  tags: docker_install

- name: Make Docker GPG key readable
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    mode: "a+r"
  tags: docker_install

# === Добавление репозитория Docker ===
- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true
  tags: docker_install

# === Установка Docker Engine ===
- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  tags: docker_install

- name: Enable and start docker + containerd (systemd)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [docker, containerd]
  tags: docker_install

# === Добавление пользователя в группу docker ===
- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  tags: docker_install

# === Установка Docker Compose (standalone) ===
- name: Get latest docker-compose version from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/docker/compose/releases/latest
    return_content: true
  register: compose_latest
  when: docker_compose_standalone_version == 'latest'
  tags: docker_install

- name: Resolve docker-compose version
  ansible.builtin.set_fact:
    docker_compose_resolved: >-
      {{ compose_latest.json.tag_name if docker_compose_standalone_version == 'latest'
         else docker_compose_standalone_version }}
  tags: docker_install

- name: Check installed docker-compose version
  ansible.builtin.command: /usr/local/bin/docker-compose version --short
  register: compose_current
  changed_when: false
  failed_when: false
  tags: docker_install

- name: Install docker-compose (standalone)
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_resolved }}/docker-compose-{{ ansible_system }}-{{ ansible_architecture }}"
    dest: /usr/local/bin/docker-compose
    mode: "0755"
    force: true
  when: >-
    compose_current.rc != 0 or
    (docker_compose_resolved | regex_replace('^v', '')) != (compose_current.stdout | trim | regex_replace('^v', ''))
  tags: docker_install

# === Проверка версий ===
- name: Check docker / compose versions
  ansible.builtin.command: "{{ item }}"
  loop:
    - docker --version
    - docker compose version
    - docker-compose --version
  register: docker_versions
  changed_when: false
  tags: docker_install

- name: Show versions
  ansible.builtin.debug:
    msg: "{{ docker_versions.results | map(attribute='stdout') | list }}"
  tags: docker_install


# === Установка LazyDocker ===
- name: Get latest lazydocker version from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/jesseduffield/lazydocker/releases/latest
    return_content: true
  register: lazydocker_latest
  when: lazydocker_version == 'latest'
  tags: lazydocker

- name: Resolve lazydocker version
  ansible.builtin.set_fact:
    lazydocker_resolved: >-
      {{ (lazydocker_latest.json.tag_name if lazydocker_version == 'latest'
          else lazydocker_version) | regex_replace('^v', '') }}
  tags: lazydocker

- name: Check installed lazydocker version
  ansible.builtin.command: /usr/local/bin/lazydocker --version
  register: lazydocker_current
  changed_when: false
  failed_when: false
  tags: lazydocker

- name: Install lazydocker
  ansible.builtin.unarchive:
    src: "https://github.com/jesseduffield/lazydocker/releases/download/v{{ lazydocker_resolved }}/lazydocker_{{ lazydocker_resolved }}_Linux_{{ lazydocker_arch }}.tar.gz"
    dest: /usr/local/bin
    include: [lazydocker]
    mode: "0755"
    remote_src: true
  when: lazydocker_current.rc != 0 or lazydocker_resolved not in lazydocker_current.stdout
  tags: lazydocker