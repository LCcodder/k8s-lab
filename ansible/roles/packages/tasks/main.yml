---
- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist # Полное обновление пакетов с разрешением изменения зависимостей
    autoremove: yes # Автоматически удаляет старые ненужные пакеты/ядра
    purge: yes # Удаляет конфигурационные файлы удаленных пакетов

- name: Check if Ubuntu requires a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Trigger reboot handler if file exists
  ansible.builtin.meta: flush_handlers
  when: reboot_required_file.stat.exists
  notify: Restart Ubuntu server
