[defaults]
inventory          = hosts.ini
roles_path         = roles
interpreter_python = auto_silent
retry_files_enabled = False
forks              = 3

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
pipelining = True
# Один раз авторизовались (ключ + 2FA) - дальше соединение переиспользуется.
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ServerAliveInterval=30