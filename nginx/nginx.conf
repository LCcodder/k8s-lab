# ----------------- K8S Dashboard -----------------
server {
    listen 2443;                      
    server_name _;

    location / {
        proxy_pass https://127.0.0.1:30443;   # NodePort дашборда
        proxy_ssl_verify off;                 # у дашборда самоподписанный сертификат

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # websocket для логов и терминала
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;             # чтобы стрим логов не обрывался
    }
}

# ----------------- Kafka Admin -----------------
server {
    listen 2808;                      
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}